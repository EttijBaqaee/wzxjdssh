services:
  wzxjdssh:
    image: ghcr.io/ettijbaqaee/wzxjdssh:2.0.4
    pull_policy: missing
    container_name: wzxjdssh
    restart: unless-stopped
    ports:
      - "${WZXJDSSH_PORT:-2222}:2222"
      - "${WZXJDSSH_WEB_BIND:-127.0.0.1}:${WZXJDSSH_WEB_PORT:-2223}:2223"
    environment:
      WZXJDSSH_SERVER_VERSION: "${WZXJDSSH_SERVER_VERSION:-SSH-2.0-OpenSSH_10.0p2 Debian-7+deb13u4}"
      WZXJDSSH_RETENTION_DAYS: "${WZXJDSSH_RETENTION_DAYS:-90}"
      # 留空或 0：禁用容量清理；1024：主库及 WAL/SHM 合计上限 1 GiB。
      WZXJDSSH_DATABASE_MAX_MB: "${WZXJDSSH_DATABASE_MAX_MB:-0}"
      WZXJDSSH_MAX_AUTH_TRIES: "${WZXJDSSH_MAX_AUTH_TRIES:-0}"
      # 接入与慢速策略；时间单位为毫秒。0 只在明确支持的项目中表示不限制。
      WZXJDSSH_CONNECTIONS_PER_MINUTE: "${WZXJDSSH_CONNECTIONS_PER_MINUTE:-2048}"
      WZXJDSSH_MAX_CLIENTS: "${WZXJDSSH_MAX_CLIENTS:-4096}"
      WZXJDSSH_MAX_CLIENTS_PER_IP: "${WZXJDSSH_MAX_CLIENTS_PER_IP:-64}"
      WZXJDSSH_MAX_PENDING_HANDSHAKES: "${WZXJDSSH_MAX_PENDING_HANDSHAKES:-128}"
      WZXJDSSH_DELAY_MS: "${WZXJDSSH_DELAY_MS:-10000}"
      WZXJDSSH_DELAY_JITTER_PERCENT: "${WZXJDSSH_DELAY_JITTER_PERCENT:-10}"
      WZXJDSSH_COOLDOWN_AUTH_DELAY_MS: "${WZXJDSSH_COOLDOWN_AUTH_DELAY_MS:-10000}"
      WZXJDSSH_COOLDOWN_AUTH_DELAY_MIN_MS: "${WZXJDSSH_COOLDOWN_AUTH_DELAY_MIN_MS:-3000}"
      WZXJDSSH_COOLDOWN_AUTH_DELAY_MAX_MS: "${WZXJDSSH_COOLDOWN_AUTH_DELAY_MAX_MS:-15000}"
      WZXJDSSH_COOLDOWN_AUTH_DELAY_STEP_MS: "${WZXJDSSH_COOLDOWN_AUTH_DELAY_STEP_MS:-1000}"
      WZXJDSSH_COOLDOWN_AUTH_JITTER_PERCENT: "${WZXJDSSH_COOLDOWN_AUTH_JITTER_PERCENT:-10}"
      WZXJDSSH_PARALLEL_WINDOW_MS: "${WZXJDSSH_PARALLEL_WINDOW_MS:-60000}"
      WZXJDSSH_PARALLEL_CONNECTIONS: "${WZXJDSSH_PARALLEL_CONNECTIONS:-2}"
      WZXJDSSH_PROBE_FAILURE_THRESHOLD: "${WZXJDSSH_PROBE_FAILURE_THRESHOLD:-3}"
      WZXJDSSH_PROBE_COOLDOWN_MS: "${WZXJDSSH_PROBE_COOLDOWN_MS:-900000}"
      WZXJDSSH_PARALLEL_COOLDOWN_MS: "${WZXJDSSH_PARALLEL_COOLDOWN_MS:-3600000}"
      WZXJDSSH_HANDSHAKE_TIMEOUT_MS: "${WZXJDSSH_HANDSHAKE_TIMEOUT_MS:-20000}"
      WZXJDSSH_IDLE_TIMEOUT_MS: "${WZXJDSSH_IDLE_TIMEOUT_MS:-120000}"
      WZXJDSSH_WRITE_TIMEOUT_MS: "${WZXJDSSH_WRITE_TIMEOUT_MS:-5000}"
      WZXJDSSH_MAX_CONNECTION_TIME_MS: "${WZXJDSSH_MAX_CONNECTION_TIME_MS:-0}"
      WZXJDSSH_MODE: "${WZXJDSSH_MODE:-ssh}"
      WZXJDSSH_MAX_LINE_LENGTH: "${WZXJDSSH_MAX_LINE_LENGTH:-32}"
      WZXJDSSH_LOG_LEVEL: "${WZXJDSSH_LOG_LEVEL:-0}"
      WZXJDSSH_ADMIN_USERNAME: "${WZXJDSSH_ADMIN_USERNAME:-admin}"
      WZXJDSSH_ADMIN_PASSWORD: "${WZXJDSSH_ADMIN_PASSWORD:?请在编排环境参数中设置至少12位管理员密码}"
      WZXJDSSH_WEB_BASE_PATH: "${WZXJDSSH_WEB_BASE_PATH:-}"
      WZXJDSSH_WEB_SECURE_COOKIE: "${WZXJDSSH_WEB_SECURE_COOKIE:-false}"
    volumes:
      - hostkeys:/data
      - records:/var/lib/wzxjdssh
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1
    pids_limit: 256
    ulimits:
      nofile:
        soft: 16384
        hard: 16384
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  hostkeys:
  records:
