services:
  wzxjdssh:
    image: wzxjdssh:1.0.2
    pull_policy: never
    container_name: wzxjdssh
    restart: unless-stopped
    ports:
      - "${WZXJDSSH_PORT:-2222}:2222"
    environment:
      WZXJDSSH_SERVER_VERSION: "${WZXJDSSH_SERVER_VERSION:-SSH-2.0-OpenSSH_10.0p2 Debian-7+deb13u4}"
    volumes:
      - hostkeys:/data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 1
    pids_limit: 256
    ulimits:
      nofile:
        soft: 16384
        hard: 16384
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  hostkeys:
