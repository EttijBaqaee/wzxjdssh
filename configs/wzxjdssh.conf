# Durations are milliseconds. Spaces and tabs are both accepted.
Mode ssh
Port 2222
BindFamily 0
Delay 10000
MaxLineLength 32
MaxClients 4096
MaxClientsPerIP 64
ConnectionsPerMinute 120
MaxPendingHandshakes 128
MaxAuthTries 0
ParallelWindow 60000
ParallelConnections 2
HandshakeTimeout 20000
IdleTimeout 120000
WriteTimeout 5000
# Slow connections have no lifetime deadline, including with older nonzero values.
MaxConnectionTime 0
HostKeyDirectory /data
ServerVersion SSH-2.0-OpenSSH_10.0p2 Debian-7+deb13u4
LogLevel 0
